    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/sahayatri_physio"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
